<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>            
           <h2>Szerkesztés:</h2>
           <hr></hr>
             Név:
             <h:inputText value="#{kontaktLista.selectedContact.name}"/><br/>    
             Email:
             <h:inputText value="#{kontaktLista.selectedContact.email}"/><br/>
             Születés nap:
             <h:inputText value="#{kontaktLista.selectedContact.birthdate}"><br/>
                <f:convertDateTime pattern="yyyy-MM-dd"/>
            </h:inputText>            
             <h:outputText value="#{kontaktLista.hiba}" style="color:red"/><br/>
             <h:commandButton value="Mentés" action="#{kontaktLista.saveEditedContact()}"/>
             <h:commandButton value="Mégsem" action="index" immediate="true"/>
        </h:form>
    </h:body>
</html>
