<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form> 
            <h:inputText value="#{kontaktLista.search}"/><h:commandButton value="Keresés" action="#{kontaktLista.szures}"/>               
           <h2>Kontaktok:</h2> 
           <hr></hr>
           <h:dataTable value="#{kontaktLista.contacts}" var="p">             
                <h:column>
                    <f:facet name="header">
                        Név
                    </f:facet> 
                    <h:commandLink value="#{p.name}" action="#{kontaktLista.updatePhones(p)}"/> <br/>                                 
                </h:column>
               
                <h:column>
                <f:facet name="header">
                       Email
                    </f:facet>                    
                    #{p.email}                
                </h:column>
               
                 <h:column>
                 <f:facet name="header">
                        Születés nap
                    </f:facet>
                     <div align="center">
                    <h:outputText value="#{p.birthdate}">
                         <f:convertDateTime type="date" pattern="yyyy-MM-dd"/>  
                    </h:outputText>
                     </div>
                </h:column>               
            
                 <h:column>
                 <f:facet name="header">
                        Műveletek
                    </f:facet>                    
                      <h:column><h:commandButton value="Törlés" action="#{kontaktLista.removeContact(p)}"/><h:outputText value=" "/></h:column>                 
                      <h:column><h:commandButton value="Szerkesztés" action="#{kontaktLista.ContactSzerkeszt(p.id)}"/></h:column> 
                </h:column>
                
            </h:dataTable> 
           <h:commandButton value="Új kontakt" action="#{kontaktLista.ujKontaktFelvetel()}"/>
             <hr></hr>
             
             <h:dataTable value="#{kontaktLista.phones}" var="f">                  
                 <h:column>
                <f:facet name="header">
                       Telefonszámok
                    </f:facet>                    
                    #{f.number}                         
                </h:column>
                 <h:column><h:commandButton value="Törlés" action="#{kontaktLista.removePhone(f)}"/></h:column>                               
                 <h:column><h:commandButton value="Szerkesztés" action="#{kontaktLista.PhoneSzerkeszt(f.id)}"/></h:column>          
             </h:dataTable>
             <h:commandButton value="Új szám" action="#{kontaktLista.ujPhoneFelvetel()}"/>
        </h:form>
    </h:body>
</html>
