<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
            Országok:
            <h:selectOneMenu value="#{orszagLista.selectedCountryID}">
                <f:selectItems value="#{orszagLista.countries}" var="cou" 
                               itemLabel="#{cou.name} (#{cou.localName})" itemValue="#{cou.code}"/>
            </h:selectOneMenu>
            <h:commandButton value="Kiválaszt" action="#{orszagLista.orszagValaszt()}"/> <br/>
            Kiválasztott ország: #{orszagLista.selectedCountryID} 
            <h:commandButton value="Új város felvétele" action="#{orszagLista.newCity()}"/>
            <br/>

            <h:dataTable value="#{orszagLista.cities}" var="city">
                <h:column>
                    <f:facet name="header">Név</f:facet>
                        #{city.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Megye</f:facet>
                        #{city.district}
                </h:column>

                <h:column>
                    <f:facet name="header">Lakosság</f:facet>
                        #{city.population}
                </h:column>

                <h:column>
                    <f:facet name="header">Módosítás</f:facet>
                    <h:commandButton value="Szerkeszt" action="#{orszagLista.editCity(city)}"/> 
                    <h:commandButton value="Töröl" action="#{orszagLista.removeCity(city)}"/> 
                </h:column>

            </h:dataTable>
        </h:form>
    </h:body>
</html>
