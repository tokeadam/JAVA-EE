<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
            <h:commandLink value="Vásárlás folytatása" action="index"/> <br/>
            <h:dataTable value="#{kosar.kosarElemek}" var="ke">
                <h:column>
                    <f:facet name="header">
                        Mennyiség
                    </f:facet>                    
                    #{ke.qty} <h:commandButton value="+" action="#{kosar.incQty(ke)}"/> 
                    <h:commandButton value="-" action="#{kosar.decQty(ke)}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        Előadó
                    </f:facet>                    
                    #{ke.product.artist}
                </h:column>

                <h:column>
                    <f:facet name="header">
                        Album
                    </f:facet>                    
                    #{ke.product.title}
                </h:column>

                <h:column>
                    <f:facet name="header">
                        Kiadó
                    </f:facet>                    
                    #{ke.product.company}
                </h:column>

                <h:column>
                    <f:facet name="header">
                        Egységár
                    </f:facet>  
                    <h:outputText value="#{ke.product.price}">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                    </h:outputText>

                </h:column>

                <h:column>
                    <f:facet name="header">
                        Össz. Ár
                    </f:facet> 
                    <h:outputText value="#{ke.price}">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                    </h:outputText>

                    <f:facet name="footer">
                        <h:outputText value="#{kosar.sumPrice}" style="font-size: 150%;font-weight: bold">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2" pattern="#,###"/>
                        </h:outputText>                        
                    </f:facet>  
                </h:column>

                <h:column>
                    <f:facet name="header">
                        Művelet
                    </f:facet>                    
                    <h:commandButton value="Törlés" action="#{kosar.remove(ke)}"/>
                </h:column>

            </h:dataTable>
        </h:form>
    </h:body>
</html>
