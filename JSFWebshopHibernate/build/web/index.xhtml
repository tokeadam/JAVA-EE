<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
            <h:commandLink value="Kosár tartalmának megtekintése(#{kosar.sumQuantity} db. elem)" action="cart"/> <br/>
            <h:dataTable value="#{listazo.products}" var="prod">
                
                <h:column>
                    <f:facet name="header">
                        Előadó
                    </f:facet>                    
                    #{prod.artist}
                </h:column>
                
                <h:column>
                    <f:facet name="header">
                        Album
                    </f:facet>                    
                    #{prod.title}
                </h:column>
                
                <h:column>
                    <f:facet name="header">
                        Kiadó
                    </f:facet>                    
                    #{prod.company}
                </h:column>
                
                <h:column>
                    <f:facet name="header">
                        Ár
                    </f:facet>                    
                    #{prod.price}
                </h:column>
                
                <h:column>
                    <f:facet name="header">
                       Vásárlás
                    </f:facet>                    
                    <h:commandButton value="Kosárba" action="#{kosar.add(prod)}"/>
                </h:column>
                
            </h:dataTable>
        </h:form>
    </h:body>
</html>
